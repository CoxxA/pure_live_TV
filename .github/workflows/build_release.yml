name: Refresh Android 5 release index

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android5-release-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android5-compat
          fetch-depth: 0
      - name: Index only published compatibility packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          repository = os.environ['REPOSITORY']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/releases?per_page=100',
              headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}', 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request) as response:
              releases = json.load(response)
          pattern = re.compile(r'^v(\d+)\.(\d+)\.(\d+)-android5\.(\d+)$')
          indexed = []
          for release in releases:
              match = pattern.fullmatch(release['tag_name'])
              if release.get('draft') or match is None:
                  continue
              files = []
              abis = []
              for abi in ['armeabi-v7a', 'arm64-v8a']:
                  name = f'PureLive-TV-android5-{abi}-skia.apk'
                  for asset in release['assets']:
                      expected = f'https://github.com/{repository}/releases/download/{release["tag_name"]}/{name}'
                      if asset['name'] == name and asset['browser_download_url'] == expected:
                          files.append({'name': name, 'size': f'{asset["size"] / 1048576:.2f} MB', 'downloads': asset['download_count'], 'url': expected})
                          abis.append(abi)
              if len(files) != 2:
                  continue
              indexed.append((tuple(map(int, match.groups())), release, files, abis))
          indexed.sort(key=lambda row: row[0], reverse=True)
          if not indexed:
              raise SystemExit('No complete Android 5 release exists; leaving the manifest unchanged.')
          history = []
          for _, release, files, _ in indexed:
              history.append({'version': release['tag_name'][1:], 'title': release['name'], 'date': release['published_at'][:10],
                  'github': release['html_url'], 'author': {'name': repository.split('/')[0]}, 'changeLog': release['body'] or '', 'files': files})
          Path('assets/releases.json').write_text(json.dumps(history, ensure_ascii=False, indent=2) + '\n')
          _, latest, _, abis = indexed[0]
          manifest = {'version': latest['tag_name'][1:], 'version_desc': latest['body'] or '',
              'prerelease': latest['prerelease'], 'android_abis': abis, 'download_url': latest['html_url']}
          Path('assets/version.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Save the compatibility index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- assets/version.json assets/releases.json; then
            git add assets/version.json assets/releases.json
            git commit -m 'chore: refresh Android 5 releases [skip ci]'
            git pull --rebase origin android5-compat
            git push origin HEAD:android5-compat
          fi
