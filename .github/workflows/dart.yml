name: Android 5 compatibility

on:
  push:
    branches: [android5-compat]
    tags: ['v*-android5.*']
  pull_request:
    branches: [android5-compat]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish the version in pubspec.yaml after all checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --concurrency=2

  build:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate the compatibility version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          match = re.search(r'^version: (\d+\.\d+\.\d+-android5\.\d+)\+\d+\s*$', Path('pubspec.yaml').read_text(), re.M)
          if match is None:
              raise SystemExit('pubspec.yaml must contain an Android 5 compatibility version')
          tag = 'v' + match.group(1)
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/') and ref != 'refs/tags/' + tag:
              raise SystemExit('Release tag does not match pubspec.yaml')
          Path('compat-release-tag.txt').write_text(tag + '\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Restore the dedicated release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name. Compatibility APKs require a persistent signing key."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android5.jks"
          python3 - <<'PY'
          import os
          from pathlib import Path
          def prop(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:')
          values = {
              'storeFile': os.environ['RUNNER_TEMP'] + '/android5.jks',
              'storePassword': os.environ['STORE_PASSWORD'],
              'keyPassword': os.environ['KEY_PASSWORD'],
              'keyAlias': os.environ['KEY_ALIAS'],
          }
          Path('android/key.properties').write_text(''.join(f'{key}={prop(value)}\n' for key, value in values.items()))
          PY
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build ARM packages and the emulator package
        run: flutter build apk --release --flavor skia --split-per-abi --target-platform android-arm,android-arm64,android-x64
      - name: Check the package identity, Android floor and v1 signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp compat-release-tag.txt dist/compat-release-tag.txt
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          aapt="$(dirname "$signer")/aapt"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            source="build/app/outputs/flutter-apk/app-$abi-skia-release.apk"
            target="dist/PureLive-TV-android5-$abi-skia.apk"
            cp "$source" "$target"
            "$aapt" dump badging "$target" > "$target.metadata.txt"
            grep -q "package: name='com.coxxa.purelive.tv.android5'" "$target.metadata.txt"
            grep -q "sdkVersion:'21'" "$target.metadata.txt"
            "$signer" verify --verbose --min-sdk-version 21 "$target" | tee "$target.signature.txt"
            grep -q 'Verified using v1 scheme (JAR signing): true' "$target.signature.txt"
          done
          cd dist
          sha256sum PureLive-TV-android5-armeabi-v7a-skia.apk PureLive-TV-android5-arm64-v8a-skia.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android5-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  api22-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android5-apks
          path: dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 5.1 / API 22
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 22
          arch: x86_64
          target: default
          disable-animations: true
          script: bash tool/api22_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api22-startup-evidence
          path: dist/api22-*

  publish:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_preview)
    needs: [build, api22-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android5-apks
          path: dist
      - name: Read the checked package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag=$(cat dist/compat-release-tag.txt)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-android5\.[0-9]+$ ]]
          printf 'release_tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Publish the compatibility preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          name: '${{ steps.version.outputs.release_tag }} · Android 5 compatibility preview'
          body: |
            为 Android 5.1.1 制作的独立兼容版，基于 Pure Live TV v3.0.7。
            固定 Skia 渲染器，保留 MPV / IJK，支持与旧版并行安装。

            提供 armeabi-v7a（32 位）及 arm64-v8a（64 位）安装包；按电视系统架构选择。
            SHA256SUMS 列出两个安装包的校验值。

            这是预览版。该电视已完成安装、启动及三平台基本播放验证。
            MPV 兼容模式已由机主确认声音同步，仍有轻微掉帧，机主反馈旧版也有类似现象。
            默认开启 MPV 兼容模式；IJK 关闭截图 GLES 路径后卡顿改善，但这台电视仍音画不同步，暂不推荐。
            修复 Android 5 搜索等原生输入框不能显示的问题，改用支持 API19+ 的组合方式。
          files: |
            dist/PureLive-TV-android5-armeabi-v7a-skia.apk
            dist/PureLive-TV-android5-arm64-v8a-skia.apk
            dist/SHA256SUMS

  update-release-index:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_preview)
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/build_release.yml
